<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Naba' Al-Namir">
  <defs>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E86C8"/>
      <stop offset="55%" stop-color="#155B9B"/>
      <stop offset="100%" stop-color="#0C2F5C"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FA8E0"/>
      <stop offset="100%" stop-color="#12508C"/>
    </linearGradient>
    <clipPath id="dropClip">
      <path d="M100 12 C96 34 60 86 50 112 A56 56 0 1 0 150 112 C140 86 104 34 100 12 Z"/>
    </clipPath>
  </defs>

  <!-- droplet body -->
  <path d="M100 12 C96 34 60 86 50 112 A56 56 0 1 0 150 112 C140 86 104 34 100 12 Z"
        fill="none" stroke="url(#dropGrad)" stroke-width="13" stroke-linejoin="round"/>

  <!-- inner highlight droplet -->
  <path d="M86 66 C85 74 74 90 74 97 a12 12 0 0 0 24 0 c0 -7 -11 -23 -12 -31 Z"
        fill="url(#dropGrad)" opacity=".9"/>

  <!-- swirling water -->
  <g clip-path="url(#dropClip)">
    <path d="M34 128 C58 100 104 100 118 128 C128 148 112 166 94 160 C80 155 78 138 90 132"
          fill="none" stroke="url(#waveGrad)" stroke-width="15" stroke-linecap="round"/>
    <path d="M46 168 C70 186 112 184 132 162 C148 144 146 118 128 108"
          fill="none" stroke="url(#waveGrad)" stroke-width="15" stroke-linecap="round" opacity=".92"/>
  </g>

  <!-- sparkle -->
  <path d="M116 112 C119 122 122 125 132 128 C122 131 119 134 116 144 C113 134 110 131 100 128 C110 125 113 122 116 112 Z"
        fill="#ffffff"/>
</svg>
